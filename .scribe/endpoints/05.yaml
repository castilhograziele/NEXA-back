name: Check-in
description: |-

  Endpoints para gerenciamento de check-in em eventos.
  O self-checkin pode ser feito via QR Code ou pelo botão no app.
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: 'api/events/{event_id}/self-checkin'
    metadata:
      custom: []
      groupName: Check-in
      groupDescription: |-

        Endpoints para gerenciamento de check-in em eventos.
        O self-checkin pode ser feito via QR Code ou pelo botão no app.
      subgroup: ''
      subgroupDescription: ''
      title: 'Self check-in'
      description: |-
        O próprio usuário realiza o check-in ao escanear o QR Code
        ou clicar no botão "Faça seu check-in" dentro do evento.
        O benefício é liberado automaticamente após a confirmação.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      event_id:
        custom: []
        name: event_id
        description: 'The ID of the event.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      event:
        custom: []
        name: event
        description: 'ID do evento.'
        required: true
        example: 3
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
      event_id: 1
      event: 3
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses: []
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
